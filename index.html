<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 编辑器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📝 Markdown 编辑器</h1>
            <div class="toolbar">
                <button class="toolbar-btn" onclick="insertText('# ')" title="标题">
                    <span>H1</span>
                </button>
                <button class="toolbar-btn" onclick="insertText('## ')" title="二级标题">
                    <span>H2</span>
                </button>
                <button class="toolbar-btn" onclick="insertText('### ')" title="三级标题">
                    <span>H3</span>
                </button>
                <button class="toolbar-btn" onclick="insertText('**')" title="加粗">
                    <span>B</span>
                </button>
                <button class="toolbar-btn" onclick="insertText('_')" title="斜体">
                    <span>I</span>
                </button>
                <button class="toolbar-btn" onclick="insertText('`')" title="代码">
                    <span>&lt;/&gt;</span>
                </button>
                <button class="toolbar-btn" onclick="insertText('- ')" title="列表">
                    <span>•</span>
                </button>
                <button class="toolbar-btn" onclick="insertText('[]()')" title="链接">
                    <span>🔗</span>
                </button>
                <button class="toolbar-btn" onclick="insertText('![]()')" title="图片">
                    <span>🖼️</span>
                </button>
                <button class="toolbar-btn" onclick="insertText('---')" title="分隔线">
                    <span>─</span>
                </button>
                <button class="toolbar-btn" onclick="insertText('> ')" title="引用">
                    <span>❝</span>
                </button>
                <button class="toolbar-btn" onclick="clearEditor()" title="清空">
                    <span>🗑️</span>
                </button>
                <button class="toolbar-btn" onclick="saveFile()" title="保存">
                    <span>💾</span>
                </button>
                <button class="toolbar-btn" onclick="loadFile()" title="打开">
                    <span>📂</span>
                </button>
            </div>
        </header>
        
        <div class="editor-container">
            <div class="editor-pane">
                <div class="pane-header">
                    <h3>编辑</h3>
                    <span class="word-count">0 字</span>
                </div>
                <textarea 
                    id="markdown-input" 
                    placeholder="开始编写 Markdown 内容...&#10;&#10;支持以下语法：&#10;- # 标题&#10;- **加粗** 和 _斜体_&#10;- `代码`&#10;- - 列表&#10;- [链接](url)&#10;- ![](图片 url)&#10;- > 引用"
                    spellcheck="false"
                ></textarea>
            </div>
            
            <div class="preview-pane">
                <div class="pane-header">
                    <h3>预览</h3>
                </div>
                <div id="markdown-preview" class="preview-content"></div>
            </div>
        </div>
        
        <footer class="footer">
            <div class="status-bar">
                <span id="status-text">就绪</span>
                <span id="cursor-position">行：1, 列：1</span>
            </div>
        </footer>
    </div>
    
    <script src="lib/marked.min.js"></script>
    <script src="lib/highlight.min.js"></script>
    <link rel="stylesheet" href="lib/github.min.css">
    <script src="app.js"></script>
</body>
</html>
